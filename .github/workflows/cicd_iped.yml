name: BUILD IPED

on: [push]

# Stack (CUDA + Ubuntu + Python + torch) usada pelas tags estaveis. Definida em
# stacks/<nome>.env. Para promover uma stack candidata, troque STABLE_STACK.
#
# Tags (o nome define o IPED instalado e o que e publicado):
#   iped_snapshot                snapshot do SNAPSHOT_WORKFLOW_ID do Dockerfile.processor
#   iped_snapshot-<run id>       snapshot desse run do IPED (sem editar o Dockerfile)
#       -> publicam latest, snapshot, processor, dependencies (+ snapshot-<run id>)
#   iped_v4.3.1 / iped_4.3.1     release 4.3.1
#       -> publica SO v4.3.1, processor_v4.3.1, dependencies_v4.3.1 (nao toca em latest)
#   iped_<qualquer acima>__<stack>   candidata: constroi a stack indicada e publica SO
#       tags com o sufixo da stack; nunca altera latest, dependencies nem processor.
# Cada build usa bases com nome proprio da versao (dependencies_<v>, processor_<v>), para
# que dois runs simultaneos nao montem uma imagem sobre o processor do outro.
env:
  STABLE_STACK: u2204-cu126-py312

jobs:
  build:

    runs-on: ubuntu-latest

    if: startsWith(github.ref, 'refs/tags/iped_')

    # 1. Permissões necessárias para o GITHUB_TOKEN conseguir gravar no GHCR
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v3

    - name: Set Environment
      run: |
        TAG=${GITHUB_REF#refs/tags/iped_}
        RAW=${TAG%%__*}
        [[ "$TAG" == *__* ]] && STACK=${TAG#*__} || STACK=$STABLE_STACK
        [[ "$STACK" =~ ^[A-Za-z0-9._-]+$ ]] && test -f stacks/${STACK}.env || { echo "Stack '${STACK}' nao existe em stacks/"; exit 1; }

        # O IPED instalado segue o nome da tag, assim a tag publicada nunca diz uma
        # versao e contem outra. Nomes fora destes formatos sao recusados (um erro de
        # digitacao como "snapshots" nao pode virar uma release inexistente).
        if [[ "$RAW" =~ ^snapshot(-([0-9]+))?$ ]]; then
          NAME=snapshot
          WFID=${BASH_REMATCH[2]}
          IPED_ARGS="SNAPSHOT=true${WFID:+
        SNAPSHOT_WORKFLOW_ID=$WFID}"
        elif [[ "$RAW" =~ ^v?[0-9]+(\.[0-9]+)*$ ]]; then
          NAME=$RAW
          WFID=
          IPED_ARGS="SNAPSHOT=false
        IPED_RELEASE_VERSION=${RAW#v}"
        else
          echo "Nome de tag invalido: $TAG (use snapshot, snapshot-<run id> ou uma versao como v4.3.1)"; exit 1
        fi

        if [[ "$TAG" == *__* ]]; then
          DEPS_MAIN=dependencies_${STACK}
          DEPS_CACHE=$DEPS_MAIN
          DEPS_TAGS="dependencies_${STACK}"
          PROCESSOR_BASE=processor_${NAME}_${STACK}
          PROCESSOR_TAGS="$PROCESSOR_BASE"
          FINAL_TAGS="${NAME}_${STACK}"
        else
          DEPS_MAIN=dependencies_${NAME}
          DEPS_CACHE=dependencies
          PROCESSOR_BASE=processor_${NAME}
          if [[ "$NAME" == snapshot ]]; then
            # So o snapshot atualiza as tags moveis
            DEPS_TAGS="dependencies $DEPS_MAIN"
            PROCESSOR_TAGS="processor $PROCESSOR_BASE"
            FINAL_TAGS="latest snapshot${WFID:+ snapshot-$WFID}"
          else
            DEPS_TAGS="$DEPS_MAIN"
            PROCESSOR_TAGS="$PROCESSOR_BASE"
            FINAL_TAGS="$NAME"
          fi
        fi
        GHCR_REPO=$(echo ghcr.io/${{ github.repository }} | tr '[:upper:]' '[:lower:]')

        # "tag1 tag2" -> uma imagem por linha, nos dois registries
        tags_for() { for t in $1; do echo "joaca/iped:$t"; echo "$GHCR_REPO:$t"; done; }

        echo VERSION=$NAME >> $GITHUB_ENV
        echo STACK=$STACK >> $GITHUB_ENV
        echo GHCR_REPO=$GHCR_REPO >> $GITHUB_ENV
        echo DEPS_MAIN=$DEPS_MAIN >> $GITHUB_ENV
        echo DEPS_CACHE=$DEPS_CACHE >> $GITHUB_ENV
        echo DEPS_TAGS=$DEPS_TAGS >> $GITHUB_ENV
        echo "STACK_ARGS=$(grep -E '^[A-Z_0-9]+=' stacks/${STACK}.env | sed 's/^/--build-arg /' | tr '\n' ' ')" >> $GITHUB_ENV
        { echo 'PROCESSOR_TAGS<<EOF'; tags_for "$PROCESSOR_TAGS"; echo EOF; } >> $GITHUB_ENV
        { echo 'FINAL_TAGS<<EOF'; tags_for "$FINAL_TAGS"; echo EOF; } >> $GITHUB_ENV
        { echo 'PROCESSOR_BUILD_ARGS<<EOF'; echo "BASE_IMAGE=joaca/iped:$DEPS_MAIN"; echo "$IPED_ARGS"; echo EOF; } >> $GITHUB_ENV
        echo FINAL_BUILD_ARGS=BASE_IMAGE=joaca/iped:$PROCESSOR_BASE >> $GITHUB_ENV

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Docker login (Docker Hub)
      run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_TOKEN }}

    # 2. Login no GitHub Container Registry usando o token nativo do Actions
    - name: Docker login (GHCR)
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

#
# O runner usa BuildKit: --cache-from so aproveita camadas de uma imagem gerada com
# BUILDKIT_INLINE_CACHE=1 (sem isso, 0 camadas em cache e ~45 min por tag). A primeira
# build com o argumento ainda e completa; as seguintes usam o cache.
#
    - name: Docker pull dependecies
      run: docker pull joaca/iped:$DEPS_CACHE || echo could not pull

    - name: Docker build dependecies
      run: docker build --build-arg BUILDKIT_INLINE_CACHE=1 --cache-from joaca/iped:$DEPS_CACHE $STACK_ARGS . -f Dockerfile.dependencies -t joaca/iped:$DEPS_MAIN

    # 3. Fazendo tag e push em ambos os registries no step manual
    - name: Docker push dependecies
      run: |
        for t in $DEPS_TAGS; do
          docker tag joaca/iped:$DEPS_MAIN joaca/iped:$t
          docker tag joaca/iped:$DEPS_MAIN $GHCR_REPO:$t
          docker push joaca/iped:$t
          docker push $GHCR_REPO:$t
        done

    # 4. Adicionando as tags do GHCR direto nas actions de build
    - name: Docker build processor
      uses: docker/build-push-action@v4
      with:
        context: .
        file: Dockerfile.processor
        tags: ${{ env.PROCESSOR_TAGS }}
        build-args: ${{ env.PROCESSOR_BUILD_ARGS }}
        push: true
        secrets: |
          "ACTION_GH_TOKEN=${{ secrets.ACTION_GH_TOKEN }}"

    - name: Docker build iped
      uses: docker/build-push-action@v4
      with:
        context: .
        tags: ${{ env.FINAL_TAGS }}
        build-args: ${{ env.FINAL_BUILD_ARGS }}
        push: true
